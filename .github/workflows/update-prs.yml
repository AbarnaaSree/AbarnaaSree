name: Update Merged PRs

on:
  # Automatically update whenever a PR is merged
  pull_request:
    types:
      - closed

  # Daily backup
  schedule:
    - cron: "0 3 * * *"

  # Allow manual update
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-merged-prs
  cancel-in-progress: true

jobs:
  update-readme:
    # Only run for merged PRs when triggered by pull_request.
    # Always run for schedule/manual execution.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch merged PRs and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: AbarnaaSree
          README_PATH: README.md
          MAX_PRS: "20"
        run: |
          cat << 'JS_EOF' > update-prs.mjs
          import { readFileSync, writeFileSync } from "node:fs";

          const token = process.env.GITHUB_TOKEN;
          const username = process.env.GH_USERNAME;
          const readmePath = process.env.README_PATH;
          const maxPRs = Number.parseInt(process.env.MAX_PRS || "20", 10);

          const START_MARKER = "<!--START_MERGED_PRS-->";
          const END_MARKER = "<!--END_MERGED_PRS-->";

          if (!token) {
            throw new Error("GITHUB_TOKEN is missing.");
          }

          if (!username) {
            throw new Error("GH_USERNAME is missing.");
          }

          async function fetchMergedPRs() {
            const query = `
              query($searchQuery: String!, $first: Int!) {
                search(
                  query: $searchQuery
                  type: ISSUE
                  first: $first
                ) {
                  nodes {
                    ... on PullRequest {
                      number
                      title
                      url
                      merged
                      mergedAt
                      repository {
                        nameWithOwner
                      }
                    }
                  }
                }
              }
            `;

            const searchQuery =
              `is:pr is:merged author:${username}`;

            console.log("Searching GitHub for:");
            console.log(searchQuery);

            const response = await fetch(
              "https://api.github.com/graphql",
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                  "User-Agent": "update-merged-prs-workflow",
                  Accept: "application/vnd.github+json"
                },
                body: JSON.stringify({
                  query,
                  variables: {
                    searchQuery,
                    first: 100
                  }
                })
              }
            );

            const responseText = await response.text();

            if (!response.ok) {
              throw new Error(
                `GitHub API HTTP ${response.status}: ${responseText}`
              );
            }

            const json = JSON.parse(responseText);

            if (json.errors) {
              throw new Error(
                `GitHub GraphQL errors: ${JSON.stringify(json.errors)}`
              );
            }

            const nodes =
              json?.data?.search?.nodes ?? [];

            const prs = nodes
              .filter(
                (pr) =>
                  pr &&
                  pr.merged === true &&
                  pr.mergedAt
              )
              .sort(
                (a, b) =>
                  new Date(b.mergedAt) -
                  new Date(a.mergedAt)
              )
              .slice(0, maxPRs);

            console.log(
              `Found ${prs.length} merged PR(s).`
            );

            return prs;
          }

          function buildMarkdown(prs) {
            if (prs.length === 0) {
              return [
                "> No merged pull requests found yet.",
                "> GitHub Actions will automatically refresh this section."
              ].join("\n");
            }

            const header =
              "| Repository | PR | Title | Status |\n" +
              "|---|---|---|---|";

            const rows = prs.map((pr) => {
              const repo =
                pr.repository?.nameWithOwner ||
                "unknown";

              const title =
                (pr.title || "Untitled")
                  .replace(/\|/g, "\\|")
                  .replace(/\r?\n/g, " ");

              return (
                `| **${repo}** | ` +
                `[#${pr.number}](${pr.url}) | ` +
                `${title} | ` +
                `✅ **Merged** |`
              );
            });

            return [
              header,
              ...rows
            ].join("\n");
          }

          function updateReadme(markdown) {
            const original =
              readFileSync(readmePath, "utf8");

            const startIndex =
              original.indexOf(START_MARKER);

            const endIndex =
              original.indexOf(END_MARKER);

            if (startIndex === -1) {
              throw new Error(
                `Missing marker: ${START_MARKER}`
              );
            }

            if (endIndex === -1) {
              throw new Error(
                `Missing marker: ${END_MARKER}`
              );
            }

            if (endIndex <= startIndex) {
              throw new Error(
                "END marker appears before START marker."
              );
            }

            const before =
              original.slice(
                0,
                startIndex + START_MARKER.length
              );

            const after =
              original.slice(endIndex);

            const replacement =
              `${before}\n${markdown}\n${after}`;

            if (replacement === original) {
              console.log(
                "README is already up to date."
              );
              return false;
            }

            writeFileSync(
              readmePath,
              replacement,
              "utf8"
            );

            console.log(
              "README.md successfully updated."
            );

            return true;
          }

          async function main() {
            const prs =
              await fetchMergedPRs();

            const markdown =
              buildMarkdown(prs);

            updateReadme(markdown);

            console.log(
              `Processed ${prs.length} merged PR(s).`
            );
          }

          main().catch((error) => {
            console.error(
              "❌ Failed to update merged PRs:"
            );

            console.error(error);

            process.exit(1);
          });
          JS_EOF

          node update-prs.mjs

      - name: Commit and push README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md; then
            echo "No README changes."
          else
            git add README.md
            git commit -m "chore: update merged pull requests"
            git push
          fi
