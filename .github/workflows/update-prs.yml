name: Merged Pull Requests Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulls-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate pull request metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: AbarnaaSree

          template: classic
          base: ""
          filename: metrics.pulls.svg

          config_timezone: Asia/Kolkata

          plugin_pulls: yes
          plugin_pulls_limit: 10
          plugin_pulls_days: 365

          config_display: large
