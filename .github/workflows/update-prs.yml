name: Update Merged PRs

on:
  schedule:
    # Runs daily at 03:00 UTC. Adjust as you like.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-merged-prs
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch merged PRs and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: AbarnaaSree
          README_PATH: README.md
          MAX_PRS: '20'
        run: |
          cat << 'JS_EOF' > update-prs.mjs
          import { readFileSync, writeFileSync } from 'node:fs';

          const token = process.env.GITHUB_TOKEN;
          const username = process.env.GH_USERNAME || 'AbarnaaSree';
          const readmePath = process.env.README_PATH || 'README.md';
          const maxPRs = parseInt(process.env.MAX_PRS || '20', 10);

          const START_MARKER = '<!--START_MERGED_PRS-->';
          const END_MARKER = '<!--END_MERGED_PRS-->';

          async function fetchMergedPRs() {
            const query = `
              query($searchQuery: String!, $first: Int!) {
                search(query: $searchQuery, type: ISSUE, first: $first) {
                  nodes {
                    ... on PullRequest {
                      number
                      title
                      url
                      merged
                      mergedAt
                      repository {
                        nameWithOwner
                      }
                    }
                  }
                }
              }
            `;

            const searchQuery = `is:pr is:merged author:${username}`;

            const response = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                'User-Agent': 'update-merged-prs-workflow'
              },
              body: JSON.stringify({
                query,
                variables: { searchQuery, first: 100 }
              })
            });

            if (!response.ok) {
              const text = await response.text();
              throw new Error(`GitHub API responded with status ${response.status}: ${text}`);
            }

            const json = await response.json();

            if (json.errors) {
              throw new Error(`GitHub GraphQL API returned errors: ${JSON.stringify(json.errors)}`);
            }

            const nodes = json?.data?.search?.nodes || [];

            return nodes
              .filter((pr) => pr && pr.merged && pr.mergedAt)
              .sort((a, b) => new Date(b.mergedAt) - new Date(a.mergedAt))
              .slice(0, maxPRs);
          }

          function buildMarkdown(prs) {
            if (prs.length === 0) {
              return 'No merged pull requests found yet. Check back soon! 🚀';
            }

            const header = '| Repository | PR | Title | Status |\n|---|---|---|---|';
            const rows = prs.map((pr) => {
              const repo = pr.repository?.nameWithOwner || 'unknown';
              const title = (pr.title || '').replace(/\|/g, '\\|');
              return `| ${repo} | [#${pr.number}](${pr.url}) | ${title} | ✅ Merged |`;
            });

            return [header, ...rows].join('\n');
          }

          function updateReadme(markdown) {
            const original = readFileSync(readmePath, 'utf8');

            if (!original.includes(START_MARKER) || !original.includes(END_MARKER)) {
              console.error(`Markers ${START_MARKER} / ${END_MARKER} not found in ${readmePath}. Skipping update.`);
              return;
            }

            const pattern = new RegExp(`${START_MARKER}[\\s\\S]*?${END_MARKER}`);
            const replacement = `${START_MARKER}\n${markdown}\n${END_MARKER}`;
            const updated = original.replace(pattern, replacement);

            if (updated === original) {
              console.log('No changes detected — README already up to date.');
              return;
            }

            writeFileSync(readmePath, updated, 'utf8');
            console.log('README.md updated with latest merged PRs.');
          }

          async function main() {
            try {
              const prs = await fetchMergedPRs();
              console.log(`Fetched ${prs.length} merged PR(s) for ${username}.`);
              const markdown = buildMarkdown(prs);
              updateReadme(markdown);
            } catch (err) {
              console.error('Failed to update merged PR list:', err.message);
              console.error('Leaving README.md untouched for this run.');
              // Exit successfully so the scheduled run isn't reported as a hard
              // failure; the error is still visible in the logs for debugging.
              process.exitCode = 0;
            }
          }

          main();
          JS_EOF
          node update-prs.mjs

      - name: Commit and push changes
        env:
          README_PATH: README.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "$README_PATH"; then
            echo "No changes to README.md — skipping commit."
          else
            git add "$README_PATH"
            git commit -m "chore: update merged pull requests list [skip ci]"
            git push
          fi
