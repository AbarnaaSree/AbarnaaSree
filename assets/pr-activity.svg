
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="400"
  viewBox="0 0 1100 400"
>
<defs>

  <!-- Neon green glow -->
  <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Stronger shine -->
  <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="9" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Animated shine -->
  <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00FF88"/>
    <stop offset="50%" stop-color="#7CFFBD"/>
    <stop offset="100%" stop-color="#00FF88">
      <animate
        attributeName="offset"
        values="100%;0%;100%"
        dur="3s"
        repeatCount="indefinite"
      />
    </stop>
  </linearGradient>

</defs>

<rect
  width="100%"
  height="100%"
  rx="18"
  fill="#050A08"
  stroke="#163D2A"
  stroke-width="1"
/>

<text
  x="35"
  y="42"
  fill="#F0FFF7"
  font-family="Arial, sans-serif"
  font-size="22"
  font-weight="700"
>
Pull Request Activity
</text>

<line
  x1="70"
  y1="320"
  x2="1020"
  y2="320"
  stroke="#163D2A"
/>

<line
  x1="70"
  y1="80"
  x2="70"
  y2="320"
  stroke="#163D2A"
/>

<circle
  cx="70"
  cy="256"
  r="6"
  fill="#00FF88"
  filter="url(#strongGlow)"
>
<title>
2026-07: 4 PRs
</title>
</circle>

<text
  x="70"
  y="348"
  fill="#A7AAB5"
  font-family="Arial"
  font-size="12"
  text-anchor="middle"
>
2026-07
</text>

<circle
  cx="545"
  cy="80"
  r="6"
  fill="#00FF88"
  filter="url(#strongGlow)"
>
<title>
2026-08: 15 PRs
</title>
</circle>

<text
  x="545"
  y="348"
  fill="#A7AAB5"
  font-family="Arial"
  font-size="12"
  text-anchor="middle"
>
2026-08
</text>

<circle
  cx="1020"
  cy="160"
  r="6"
  fill="#00FF88"
  filter="url(#strongGlow)"
>
<title>
2026-09: 10 PRs
</title>
</circle>

<text
  x="1020"
  y="348"
  fill="#A7AAB5"
  font-family="Arial"
  font-size="12"
  text-anchor="middle"
>
2026-09
</text>

<polyline
  points="70,256 545,80 1020,160"
  fill="none"
  stroke="#00FF88"
  filter="url(#greenGlow)"
  stroke-width="4"
  stroke-linecap="round"
  stroke-linejoin="round"
/>

</svg>
